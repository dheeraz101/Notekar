<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Official release notes and changelog history for NoteKar Android (Stable & Beta).">
<title>Release Notes & Changelog — NoteKar</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #121214;
    --surface2: #1c1c1e;
    --surface3: #2c2c2e;
    --border: rgba(255, 255, 255, 0.12);
    --border-accent: rgba(10, 132, 255, 0.35);
    --text: #ffffff;
    --text2: #a1a1a6;
    --text3: #636366;
    --accent: #0A84FF;
    --accent-glow: rgba(10, 132, 255, 0.18);
    --green: #30D158;
    --red: #FF453A;
    --orange: #FF9F0A;
    --purple: #BF5AF2;
    --radius: 20px;
    --radius-sm: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: max(48px, env(safe-area-inset-bottom, 24px));
    padding-left: max(16px, env(safe-area-inset-left, 16px));
    padding-right: max(16px, env(safe-area-inset-right, 16px));
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  /* Header Bar */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
    margin-left: max(-16px, calc(-1 * env(safe-area-inset-left, 16px)));
    margin-right: max(-16px, calc(-1 * env(safe-area-inset-right, 16px)));
    margin-bottom: 24px;
    padding: 12px 18px;
  }

  .header-content {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
  }

  .brand img {
    width: 32px;
    height: 32px;
    border-radius: 8px;
  }

  .brand-text {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    transition: all 0.2s ease;
    min-height: 34px;
  }

  .nav-btn:hover {
    background: var(--surface3);
  }

  /* Hero Section */
  .hero {
    text-align: center;
    padding: 16px 12px 24px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--accent-glow);
    border: 1px solid var(--border-accent);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 800;
    letter-spacing: -0.8px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    color: var(--text2);
    font-size: 14.5px;
    max-width: 540px;
    margin: 0 auto;
  }

  /* Controls (Search & Channel Filter Tabs) */
  .controls-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .search-bar {
    width: 100%;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-bar:focus {
    border-color: var(--accent);
  }

  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .filter-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .filter-btn.beta.active {
    background: var(--orange);
    border-color: var(--orange);
  }

  /* Release Card */
  .release-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .release-card.latest {
    border-color: var(--border-accent);
    box-shadow: 0 8px 32px rgba(10, 132, 255, 0.08);
  }

  .release-card.beta-card {
    border-left: 3px solid var(--orange);
  }

  .release-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .version-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .version-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.4px;
  }

  .tag-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .tag-latest { background: rgba(10, 132, 255, 0.15); color: var(--accent); border: 1px solid var(--border-accent); }
  .tag-beta { background: rgba(255, 159, 10, 0.15); color: var(--orange); border: 1px solid rgba(255, 159, 10, 0.35); }
  .tag-stable { background: rgba(48, 209, 88, 0.15); color: var(--green); border: 1px solid rgba(48, 209, 88, 0.35); }
  .tag-priority { background: rgba(10, 132, 255, 0.15); color: var(--accent); border: 1px solid var(--border-accent); }

  .release-date {
    color: var(--text3);
    font-size: 12.5px;
    font-weight: 500;
  }

  .edition-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 2px;
  }

  .edition-name.beta-edition {
    color: var(--orange);
  }

  /* Highlights Matrix */
  .highlights-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin: 14px 0;
  }

  @media (min-width: 580px) {
    .highlights-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .highlight-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .highlight-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .highlight-desc {
    font-size: 11.5px;
    color: var(--text2);
    line-height: 1.35;
  }

  /* Items List with Expressive Icons */
  .changelog-list {
    list-style: none;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .changelog-item {
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.45;
  }

  .item-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .icon-add { background: rgba(48, 209, 88, 0.15); color: var(--green); }
  .icon-remove { background: rgba(255, 69, 58, 0.15); color: var(--red); }
  .icon-improve { background: rgba(255, 159, 10, 0.15); color: var(--orange); }
  .icon-fix { background: rgba(10, 132, 255, 0.15); color: var(--accent); }
  .icon-default { background: rgba(255, 255, 255, 0.08); color: var(--text2); }

  /* Download Buttons */
  .download-bar {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #ffffff;
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    min-height: 38px;
    transition: opacity 0.2s ease;
  }

  .download-btn.beta-dl {
    background: var(--orange);
  }

  .download-btn:active {
    opacity: 0.8;
  }

  .download-btn.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text3);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <a href="index.html" class="brand">
      <img src="icon-192.png" alt="NoteKar Logo">
      <span class="brand-text">NoteKar</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="nav-btn">← Home</a>
      <a href="https://github.com/dheeraz101/Notekar-Android" target="_blank" rel="noopener" class="nav-btn">GitHub</a>
    </div>
  </div>
</header>

<div class="container">
  <section class="hero">
    <div class="hero-badge">Release Archive</div>
    <h1>Changelog & Updates</h1>
    <p>Complete official release history and architecture evolutions for NoteKar Android (Stable & Beta).</p>
  </section>

  <div class="controls-wrapper">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search features, fixes, or versions...">
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All Releases</button>
      <button class="filter-btn" data-filter="stable">Stable Releases</button>
      <button class="filter-btn beta" data-filter="beta">Beta Releases</button>
    </div>
  </div>

  <div id="changelogContainer">
    <!-- Rendered dynamically -->
  </div>

  <footer>
    <p>NoteKar is 100% Offline-First & Open Source under MIT License.</p>
    <p style="margin-top: 4px;">Crafted with precision by the NoteKar Team.</p>
  </footer>
</div>

<script>
  const GITHUB_CHANGELOG_URL = 'https://raw.githubusercontent.com/dheeraz101/Notekar-Android/main/versions/changelog.json';

  let allReleases = [];
  let currentFilter = 'all';

  function formatIcon(item) {
    const trimmed = item.trim();
    if (trimmed.startsWith('+') || trimmed.toLowerCase().startsWith('add') || trimmed.toLowerCase().startsWith('feat')) {
      return { icon: '+', className: 'icon-add', text: trimmed.replace(/^[+\-!*]\s*/, '') };
    } else if (trimmed.startsWith('-') || trimmed.toLowerCase().startsWith('remove')) {
      return { icon: '−', className: 'icon-remove', text: trimmed.replace(/^[+\-!*]\s*/, '') };
    } else if (trimmed.startsWith('!') || trimmed.toLowerCase().startsWith('fix')) {
      return { icon: '🔧', className: 'icon-fix', text: trimmed.replace(/^[+\-!*]\s*/, '') };
    } else if (trimmed.startsWith('*') || trimmed.toLowerCase().startsWith('refine') || trimmed.toLowerCase().startsWith('opt')) {
      return { icon: '★', className: 'icon-improve', text: trimmed.replace(/^[+\-!*]\s*/, '') };
    }
    return { icon: '•', className: 'icon-default', text: trimmed };
  }

  function renderReleases(releases) {
    const container = document.getElementById('changelogContainer');
    if (!releases.length) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text3);">No releases found matching your search.</div>';
      return;
    }

    container.innerHTML = releases.map(rel => {
      const isBeta = rel.isBeta || rel.channel === 'beta' || (rel.channelTag && rel.channelTag.includes('Beta'));
      const isLatest = rel.isLatest;

      let tagHtml = '';
      if (isLatest) {
        tagHtml += '<span class="tag-pill tag-latest">Latest</span>';
      }
      if (isBeta) {
        tagHtml += '<span class="tag-pill tag-beta">Beta Release</span>';
      } else if (rel.channel === 'priority') {
        tagHtml += '<span class="tag-pill tag-priority">Priority Release</span>';
      } else {
        tagHtml += '<span class="tag-pill tag-stable">Stable Release</span>';
      }

      const highlightsHtml = (rel.highlights && rel.highlights.length) ? `
        <div class="highlights-grid">
          ${rel.highlights.map(h => `
            <div class="highlight-card">
              <div class="highlight-title">${h.title}</div>
              <div class="highlight-desc">${h.description}</div>
            </div>
          `).join('')}
        </div>
      ` : '';

      const itemsHtml = (rel.fullChangelog && rel.fullChangelog.length) ? `
        <ul class="changelog-list">
          ${rel.fullChangelog.map(item => {
            const parsed = formatIcon(item);
            return `
              <li class="changelog-item">
                <span class="item-icon ${parsed.className}">${parsed.icon}</span>
                <span>${parsed.text}</span>
              </li>
            `;
          }).join('')}
        </ul>
      ` : '';

      let downloadHtml = '';
      if (rel.downloads) {
        const btns = [];
        if (rel.downloads.universalApk) {
          btns.push(`<a href="${rel.downloads.universalApk}" class="download-btn ${isBeta ? 'beta-dl' : ''}" target="_blank" rel="noopener">Download APK</a>`);
        }
        if (rel.downloads.arm64Apk) {
          btns.push(`<a href="${rel.downloads.arm64Apk}" class="download-btn secondary" target="_blank" rel="noopener">ARM64 APK</a>`);
        }
        if (btns.length) {
          downloadHtml = `<div class="download-bar">${btns.join('')}</div>`;
        }
      }

      return `
        <article class="release-card ${isLatest ? 'latest' : ''} ${isBeta ? 'beta-card' : ''}">
          <div class="release-header">
            <div>
              <div class="version-meta">
                <span class="version-title">v${rel.version}</span>
                ${tagHtml}
              </div>
              <div class="edition-name ${isBeta ? 'beta-edition' : ''}">${rel.edition || ''}</div>
            </div>
            <div class="release-date">${rel.releaseDate}</div>
          </div>
          ${highlightsHtml}
          ${itemsHtml}
          ${downloadHtml}
        </article>
      `;
    }).join('');
  }

  function filterReleases() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = allReleases.filter(rel => {
      const isBeta = rel.isBeta || rel.channel === 'beta' || (rel.channelTag && rel.channelTag.includes('Beta'));
      
      if (currentFilter === 'stable' && isBeta) return false;
      if (currentFilter === 'beta' && !isBeta) return false;

      if (!query) return true;

      const searchContent = [
        rel.version,
        rel.edition || '',
        rel.releaseDate || '',
        ...(rel.fullChangelog || []),
        ...(rel.highlights ? rel.highlights.map(h => `${h.title} ${h.description}`) : [])
      ].join(' ').toLowerCase();

      return searchContent.includes(query);
    });

    renderReleases(filtered);
  }

  async function loadChangelog() {
    try {
      const res = await fetch(GITHUB_CHANGELOG_URL);
      if (res.ok) {
        allReleases = await res.json();
        filterReleases();
        return;
      }
    } catch (e) {
      console.warn('Using local fallback changelog data', e);
    }
  }

  document.getElementById('searchInput').addEventListener('input', filterReleases);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      filterReleases();
    });
  });

  loadChangelog();
</script>

</body>
</html>
